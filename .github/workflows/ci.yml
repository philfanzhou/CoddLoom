name: CI

on:
  # Default-branch pushes are verified by release.yml before an edge package is
  # published. Keeping them out of this trigger avoids building the same commit
  # twice while preserving a reusable verification gate.
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  sqlite-package-macos-arm64:
    name: SQLite package smoke test (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 10
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Pack SQLite and its CoddLoom dependency
        run: |
          dotnet pack src/CoddLoom/CoddLoom.csproj \
            --configuration Release \
            --output artifacts/packages \
            -p:Version="$PACKAGE_VERSION" \
            -p:RepositoryCommit=${{ github.sha }}
          dotnet pack src/CoddLoom.Sqlite/CoddLoom.Sqlite.csproj \
            --configuration Release \
            --output artifacts/packages \
            -p:Version="$PACKAGE_VERSION" \
            -p:RepositoryCommit=${{ github.sha }}

      - name: Create clean package consumer
        run: |
          dotnet new console \
            --framework net8.0 \
            --output artifacts/sqlite-consumer \
            --no-restore
          dotnet add artifacts/sqlite-consumer package CoddLoom.Sqlite \
            --version "$PACKAGE_VERSION" \
            --no-restore
          cp .github/scripts/sqlite-package-smoke/Program.cs \
            artifacts/sqlite-consumer/Program.cs

      - name: Restore package consumer from local packages
        run: |
          dotnet restore artifacts/sqlite-consumer \
            --source artifacts/packages \
            --source https://api.nuget.org/v3/index.json

      - name: Run native arm64 SQLite smoke test
        run: >-
          dotnet run
          --project artifacts/sqlite-consumer
          --configuration Release
          --no-restore

  build-test-pack:
    name: Build, SQLite test, coverage, and pack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PACKAGE_VERSION: 0.0.0-ci.${{ github.run_number }}.${{ github.run_attempt }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CoddLoom.sln

      - name: Build
        run: >-
          dotnet build CoddLoom.sln
          --configuration Release
          --no-restore
          -p:Version=$PACKAGE_VERSION
          -p:RepositoryCommit=${{ github.sha }}

      - name: Test with SQLite and collect coverage
        run: >-
          dotnet test CoddLoom.sln
          --configuration Release
          --no-build
          --no-restore
          --collect "XPlat Code Coverage"
          --logger "trx;LogFileName=sqlite.trx"
          --results-directory artifacts/test-results

      - name: Enforce coverage baseline
        shell: pwsh
        run: ./.github/scripts/assert-coverage.ps1 -CoverageDirectory artifacts/test-results

      - name: Pack all public projects
        run: >-
          dotnet pack CoddLoom.sln
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:Version=$PACKAGE_VERSION
          -p:RepositoryCommit=${{ github.sha }}

      - name: Verify package set
        shell: pwsh
        run: ./.github/scripts/assert-package-set.ps1 -PackageDirectory artifacts/packages

      - name: Smoke-test package restore
        run: |
          dotnet new classlib --framework net8.0 --output artifacts/package-consumer --no-restore
          dotnet add artifacts/package-consumer package CoddLoom.Sqlite --version "$PACKAGE_VERSION" --no-restore
          dotnet add artifacts/package-consumer package CoddLoom.PostgreSql --version "$PACKAGE_VERSION" --no-restore
          dotnet restore artifacts/package-consumer \
            --source artifacts/packages \
            --source https://api.nuget.org/v3/index.json
          dotnet build artifacts/package-consumer --configuration Release --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14

      - name: Upload package validation artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-packages
          path: artifacts/packages
          if-no-files-found: error
          retention-days: 7

  database-integration:
    name: Integration (${{ matrix.provider }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: PostgreSql
            connection_key: POSTGRESQL
            connection: Host=localhost;Port=5432;Database=coddloom;Username=postgres;Password=postgres
          - provider: MySql
            connection_key: MYSQL
            connection: Server=localhost;Port=3306;Database=coddloom;Uid=root;Pwd=coddloom;
          - provider: MariaDB
            connection_key: MARIADB
            connection: Server=localhost;Port=3306;Database=coddloom;Uid=root;Pwd=coddloom;
          - provider: SqlServer
            connection_key: SQLSERVER
            connection: Server=localhost,1433;Database=master;User Id=sa;Password=CoddLoom_Strong_Password1!;Encrypt=True;TrustServerCertificate=True;
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Start ${{ matrix.provider }}
        shell: bash
        run: bash ./.github/scripts/start-test-database.sh "${{ matrix.provider }}"

      - name: Restore and build tests
        run: >-
          dotnet build tests/CoddLoom.Tests/CoddLoom.Tests.csproj
          --configuration Release

      - name: Configure database connection
        shell: bash
        run: |
          echo "TEST_DATABASE_TYPE=${{ matrix.provider }}" >> "$GITHUB_ENV"
          echo "TEST_DB_CONNECTION_${{ matrix.connection_key }}=${{ matrix.connection }}" >> "$GITHUB_ENV"

      - name: Run database integration tests
        run: >-
          dotnet test tests/CoddLoom.Tests/CoddLoom.Tests.csproj
          --configuration Release
          --no-build
          --no-restore
          --filter "TestCategory=Database"
          --logger "trx;LogFileName=${{ matrix.provider }}.trx"
          --results-directory artifacts/test-results

      - name: Show database logs on failure
        if: failure()
        run: docker logs coddloom-test-database

      - name: Upload database test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.connection_key }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 14
