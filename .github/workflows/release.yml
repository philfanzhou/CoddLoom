name: Package release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: package-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  version:
    name: Decide package version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.version.outputs.number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tagged: ${{ steps.version.outputs.tagged }}
    steps:
      - name: Validate ref and choose version
        id: version
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$IS_TAG" != "true" ]]; then
            echo "number=0.0.0-edge.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must use semantic versioning, for example v1.2.3 or v1.2.3-rc.1." >&2
            exit 1
          fi

          echo "number=${REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "tagged=true" >> "$GITHUB_OUTPUT"
          if [[ "$REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish packages
    needs: [version, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore CoddLoom.sln

      - name: Pack release artifacts
        run: >-
          dotnet pack CoddLoom.sln
          --configuration Release
          --no-restore
          --output artifacts/packages
          -p:Version=${{ needs.version.outputs.number }}
          -p:RepositoryCommit=${{ github.sha }}

      - name: Verify package set
        shell: pwsh
        run: ./.github/scripts/assert-package-set.ps1 -PackageDirectory artifacts/packages

      - name: Upload package artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ needs.version.outputs.number }}
          path: artifacts/packages
          if-no-files-found: error
          retention-days: ${{ needs.version.outputs.tagged == 'true' && 90 || 14 }}

      - name: Publish to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        run: >-
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "$GITHUB_TOKEN"
          --source "$PACKAGE_SOURCE"
          --skip-duplicate
          --no-symbols

      # Edge builds intentionally stay in GitHub Packages. NuGet.org only receives
      # versions that a semantic-version tag explicitly names.
      - name: Publish tagged version to NuGet.org
        if: needs.version.outputs.tagged == 'true'
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "The repository secret NUGET_API_KEY is required for tagged releases." >&2
            exit 1
          fi

          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub Release
        if: needs.version.outputs.tagged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release upload "$VERSION_TAG" artifacts/packages/* --clobber
            exit 0
          fi

          arguments=("$VERSION_TAG" artifacts/packages/* --verify-tag --generate-notes --title "$VERSION_TAG")
          if [[ "$PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"
